# CC-23 / #1439 — weekly dependency updates for npm, Cargo, pip, and Actions
version: 2
updates:
  # Frontend (Next.js / npm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend

  # Backend (Rust / Cargo) — backend crate root if present
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend

  # Smart contracts (Soroban / Cargo workspace)
  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - contracts

  # Root Cargo workspace (if used)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  # Agent engines (Python)
  - package-ecosystem: pip
    directory: /agent-engines
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - agent-engines

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
