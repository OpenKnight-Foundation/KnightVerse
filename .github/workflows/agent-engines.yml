name: Agent Engines CI

on:
  # Run on every PR or push to main that touches agent-engines code
  pull_request:
    paths:
      - 'agent-engines/**'
      - '.github/workflows/agent-engines.yml'
  push:
    branches:
      - main
    paths:
      - 'agent-engines/**'
      - '.github/workflows/agent-engines.yml'
  schedule:
    # Nightly run at 2 AM UTC for stress tests and tournament simulation
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test Agent Engines (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('agent-engines/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: agent-engines
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting with ruff
        working-directory: agent-engines
        run: |
          pip install ruff
          ruff check gpu_worker/ || true
          ruff format gpu_worker/ --check || true
        continue-on-error: true

      - name: Run unit tests
        working-directory: agent-engines
        run: python -m pytest tests/ -v --tb=short --durations=10 -x
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        working-directory: agent-engines
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=gpu_worker --cov-report=xml --cov-report=term-missing -q
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: agent-engines/coverage.xml
          flags: agent-engines
          fail_ci_if_error: false
        continue-on-error: true

  nightly-stress-test:
    name: Nightly Stress Test & Tournament Simulation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-nightly-${{ hashFiles('agent-engines/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install dependencies
        working-directory: agent-engines
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install websockets

      - name: Start mock backend for stress test
        working-directory: agent-engines
        run: |
          # Start a simple echo server for stress test
          python -c "
          import asyncio
          import websockets
          
          async def echo(websocket):
              async for message in websocket:
                  # Echo back a mock analysis response
                  await websocket.send('{\"best_move\": \"e2e4\", \"evaluation\": 0.0, \"depth\": 10}')
          
          async def main():
              server = await websockets.serve(echo, 'localhost', 8765)
              await server.wait_closed()
          
          asyncio.run(main())
          " &
          echo "Mock WebSocket server started on port 8765"
          sleep 2
        env:
          PYTHONPATH: .

      - name: Run stress_test.py
        working-directory: agent-engines
        run: |
          python stress_test.py
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379

      - name: Run tournament_simulator.py
        working-directory: agent-engines
        run: |
          python tournament_simulator.py
        env:
          PYTHONPATH: .

      - name: Upload stress test results
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            agent-engines/stress_test_results.json
            agent-engines/tournament_results.json

  test-no-redis:
    name: Test Graceful Redis Fallback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-no-redis-${{ hashFiles('agent-engines/pyproject.toml') }}

      - name: Install dependencies
        working-directory: agent-engines
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test graceful Redis failure handling
        working-directory: agent-engines
        run: |
          python -c "
          import asyncio
          from gpu_worker.resource_optimizer import AutoscalingConfig, AutoscalingDaemon

          async def test_no_redis():
              config = AutoscalingConfig()
              daemon = AutoscalingDaemon(config)
              queue_metrics = await daemon._get_queue_metrics()
              assert 'error' in queue_metrics or 'queue_length' in queue_metrics
              print('Graceful Redis failure handling works')

          asyncio.run(test_no_redis())
          "
        env:
          PYTHONPATH: .

  validate-dependencies:
    name: Validate Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate pyproject.toml and dependencies
        working-directory: agent-engines
        run: |
          python -m pip install --upgrade pip
          pip install tomli
          python -c "
          import sys, tomli
          with open('pyproject.toml', 'rb') as f:
              config = tomli.load(f)
          deps = config.get('project', {}).get('dependencies', [])
          required = ['redis', 'prometheus-client', 'psutil', 'pydantic']
          for req in required:
              found = any(req in d for d in deps)
              status = 'OK' if found else 'MISSING'
              print(f'[{status}] {req}')
              if not found:
                  sys.exit(1)
          print('All required dependencies present')
          "

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agent-engines
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bandit security analysis
        working-directory: agent-engines
        run: |
          pip install bandit
          bandit -r gpu_worker/ -ll -q || true

  # ---------------------------------------------------------------------------
  # Nightly Stress & Tournament Simulation (issue AI-61)
  # Only runs on the scheduled cron trigger (02:00 UTC daily).
  #
  # Healthy baseline (captured 2026-09-24):
  #   tournament_simulator  – 5 bots × 3 games/pair → 30 games, ~0.01 s total
  #   stress_test           – import + module-level smoke, no live server needed
  # ---------------------------------------------------------------------------
  nightly-stress:
    name: Nightly Stress & Tournament Simulation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        working-directory: agent-engines
        run: |
          python -m pip install --upgrade pip
          # Install only the packages required by stress_test & tournament_simulator
          pip install websockets pydantic

      - name: Run tournament simulator (5 bots, 3 games per pair)
        # Healthy baseline: 30 games finish in < 1 s with no assertion errors.
        working-directory: agent-engines
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tournament_simulator import run_round_robin, BotResult

          bots = ['AlphaBot', 'BetaBot', 'GammaBot', 'DeltaBot', 'EpsilonBot']
          # Nightly run: 3 games per pair (fast; use more for deeper validation)
          results = run_round_robin(bots, games_per_pair=3)

          total_games = sum(r.wins + r.losses + r.draws for r in results.values()) // 2
          print(f'Tournament complete: {len(bots)} bots, {total_games} games played')
          for name, r in sorted(results.items(), key=lambda x: -x[1].wins):
              print(f'  {name}: W={r.wins} D={r.draws} L={r.losses}')

          # Sanity: every bot participated
          assert len(results) == len(bots), 'Unexpected number of results'
          print('tournament_simulator: PASS')
          "

      - name: Run stress test smoke (import + minimal validation, no server)
        # Healthy baseline: module imports cleanly; run_stress_test is callable.
        # Full load test requires a live WebSocket server and is out of scope
        # for nightly CI; a live-server integration test is tracked separately.
        working-directory: agent-engines
        run: |
          python -c "
          import sys, inspect, asyncio
          sys.path.insert(0, '.')
          import stress_test

          # Verify key symbols are importable and have the expected signatures
          assert callable(stress_test.run_stress_test), 'run_stress_test not callable'
          assert callable(stress_test.run_test_client), 'run_test_client not callable'

          sig = inspect.signature(stress_test.run_stress_test)
          params = list(sig.parameters.keys())
          assert 'num_users' in params, f'Missing param num_users; got {params}'
          assert 'requests_per_user' in params, f'Missing param requests_per_user; got {params}'

          print(f'stress_test module OK – run_stress_test{sig}')
          print('stress_test: PASS')
          "

      - name: Summarise nightly results
        if: always()
        run: |
          echo "## Nightly Stress & Tournament Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Script | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| tournament_simulator | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| stress_test (smoke)  | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Schedule**: 02:00 UTC daily \`0 2 * * *\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, test-no-redis, validate-dependencies, nightly-stress-test]
    if: always()

    steps:
      - name: Generate CI Summary
        run: |
          echo "## Agent Engines CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Redis Fallback | ${{ needs.test-no-redis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Validation | ${{ needs.validate-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly Stress Test | ${{ needs.nightly-stress-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY