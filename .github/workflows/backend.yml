name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    # BE-134: the integration tests drive the real handlers against a real
    # database. Redis backs matchmaking/refresh-token revocation; the tests
    # themselves degrade gracefully when it is absent, but having it here
    # keeps the whole stack honest.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knightverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy lint
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      # The db crate's schema tests run whenever DATABASE_URL is set, so the
      # fresh Postgres service needs the tables before `cargo test` starts.
      - name: Run database migrations
        working-directory: backend
        run: cargo run -p migration -- up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/knightverse_test

      - name: Run all backend tests
        working-directory: backend
        run: cargo test --workspace
        env:
          STELLAR_NETWORK: testnet
          HORIZON_URL: https://horizon-testnet.stellar.org
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/knightverse_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/knightverse_test
          REDIS_URL: redis://localhost:6379

      - name: Build backend (debug)
        working-directory: backend
        run: cargo build --workspace

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit
        working-directory: backend
        run: |
          cargo install cargo-audit --quiet
          cargo audit \
            --ignore RUSTSEC-2024-0421 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0190 || true

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        working-directory: backend
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ env.REPO_NAME }}:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .
