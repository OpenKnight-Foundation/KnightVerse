name: Contracts CI

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  lint:
    name: Lint Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-contracts-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contracts-cargo-

      - name: Cache clippy build
        uses: actions/cache@v4
        with:
          path: contracts/target
          key: ${{ runner.os }}-contracts-clippy-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contracts-clippy-

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all --check

      - name: Run clippy
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-contracts-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contracts-cargo-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: contracts/target
          key: ${{ runner.os }}-contracts-build-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contracts-build-

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build contracts (WASM)
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      # Soroban rejects uploads above the network's contract max size
      # (128 KiB on mainnet). Bump this if the network limit changes.
      - name: Check WASM sizes
        working-directory: contracts
        env:
          WASM_MAX_BYTES: 131072
        run: |
          shopt -s nullglob
          wasm_files=(target/wasm32-unknown-unknown/release/*.wasm)
          if [ ${#wasm_files[@]} -eq 0 ]; then
            echo "::error::No .wasm files found in target/wasm32-unknown-unknown/release"
            exit 1
          fi
          failed=0
          for wasm in "${wasm_files[@]}"; do
            size=$(stat -c%s "$wasm")
            name=$(basename "$wasm")
            echo "$name: $size bytes (limit $WASM_MAX_BYTES)"
            if [ "$size" -gt "$WASM_MAX_BYTES" ]; then
              echo "::error file=$wasm::$name is $size bytes, over the $WASM_MAX_BYTES byte limit"
              failed=1
            fi
          done
          exit $failed
