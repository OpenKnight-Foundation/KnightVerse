name: Frontend CI

permissions:
  issues: write
  pull-requests: write
  contents: read

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'frontend/lighthouserc.json'
      - 'openapi.json'
      - '.github/workflows/frontend-check.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'frontend/lighthouserc.json'
      - 'openapi.json'
      - '.github/workflows/frontend-check.yml'

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API spec path check
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Storybook build dependencies
        run: npm install --no-save --no-package-lock storybook@8 @storybook/nextjs@8

      - name: Storybook build
        run: npm run storybook:build
      - name: Check per-route first-load JS budget
        run: |
          node -e '
            const fs = require("fs");
            const budgets = JSON.parse(fs.readFileSync("bundle-budgets.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync(".next/app-build-manifest.json", "utf8"));
            let failed = false;
            for (const [route, limitKb] of Object.entries(budgets)) {
              const files = manifest.pages[route] || [];
              const bytes = files
                .filter((f) => f.endsWith(".js"))
                .reduce((sum, f) => sum + fs.statSync(".next/" + f).size, 0);
              const kb = bytes / 1024;
              console.log(`${route}: ${kb.toFixed(1)} kB (budget ${limitKb} kB)`);
              if (kb > limitKb) { console.error(`FAIL: ${route} exceeds budget`); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          '

  # CC-22 / #1438 — Playwright E2E against the production build
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    needs: lint-test-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build
        env:
          # NEXT_PUBLIC_* values are inlined at build time, so the test-only
          # escrow account must be set here for the staking spec.
          NEXT_PUBLIC_STAKING_ESCROW_ADDRESS: GABAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEJXA

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          CI: true
          # Prefer the production server started by playwright.config.ts webServer
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  # FE-171 / #1675 — Lighthouse performance & accessibility gates on key pages
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: lint-test-build
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Collect Lighthouse reports
        run: npx --yes @lhci/cli@0.15.1 collect --config=./lighthouserc.json

      - name: Assert Lighthouse scores
        id: lighthouse_assert
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 assert --config=./lighthouserc.json

      - name: Save Lighthouse reports
        if: always()
        run: npx --yes @lhci/cli@0.15.1 upload --config=./lighthouserc.json

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouse
          retention-days: 14

      - name: Comment Lighthouse results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const manifestPath = path.join(process.cwd(), 'frontend', '.lighthouse', 'manifest.json');
            if (!fs.existsSync(manifestPath)) return;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const pct = (value) => value == null ? 'n/a' : `${Math.round(value * 100)}`;
            const rows = manifest
              .map((entry) => `| \`${new URL(entry.url).pathname}\` | ${pct(entry.summary.performance)} | ${pct(entry.summary.accessibility)} |`)
              .join('\n');
            const marker = '<!-- knightverse-lighthouse -->';
            const body = `${marker}\n### Lighthouse results (production build)\n\n| Page | Performance | Accessibility |\n| --- | ---: | ---: |\n${rows}\n\nMinimums: performance 70, accessibility 90.`;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Fail when Lighthouse scores are below threshold
        if: steps.lighthouse_assert.outcome == 'failure'
        run: exit 1
