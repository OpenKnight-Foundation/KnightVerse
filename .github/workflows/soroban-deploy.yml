name: Soroban Contract Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - '.github/workflows/soroban-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - futurenet
      contract_name:
        description: 'Contract to deploy (leave empty for all)'
        required: false
        type: string

env:
  # The deprecated `soroban-cli` crate no longer has the commands this workflow
  # used; use the pinned stellar CLI release, same as contract-bindings.yml.
  STELLAR_CLI_VERSION: '28.1.0'

jobs:
  validate:
    name: Validate Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-soroban-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-soroban-

      - name: Install stellar CLI
        run: |
          curl -sSL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 0755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build all contracts
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Validate WASM files
        run: |
          for wasm_file in contracts/target/wasm32-unknown-unknown/release/*.wasm; do
            echo "Validating: $wasm_file"
            stellar contract info interface --wasm "$wasm_file" > /dev/null
          done

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'testnet' }}
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'testnet' }}
    env:
      # Read by the stellar CLI for every deploy/invoke below, so the key is
      # never echoed or written to disk.
      STELLAR_NETWORK: ${{ github.event.inputs.environment || 'testnet' }}
      STELLAR_ACCOUNT: ${{ (github.event.inputs.environment == 'futurenet' && secrets.SOROBAN_FUTURENET_SECRET_KEY) || secrets.SOROBAN_SECRET_KEY }}

    steps:
      - name: Check deployment key
        id: key
        run: |
          if [ -z "$STELLAR_ACCOUNT" ]; then
            echo "::notice::No deployer secret key for $STELLAR_NETWORK; skipping deployment."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Install Rust
        if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.key.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-soroban-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-soroban-

      - name: Install stellar CLI
        if: steps.key.outputs.present == 'true'
        run: |
          curl -sSL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 0755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build contracts
        if: steps.key.outputs.present == 'true'
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Deploy contracts
        if: steps.key.outputs.present == 'true'
        env:
          CONTRACT_NAME: ${{ github.event.inputs.contract_name }}
          DEPLOYER_ADDRESS: ${{ secrets.DEPLOYER_ADDRESS }}
          ORACLE_1_ADDRESS: ${{ secrets.ORACLE_1_ADDRESS }}
          ORACLE_2_ADDRESS: ${{ secrets.ORACLE_2_ADDRESS }}
          ORACLE_3_ADDRESS: ${{ secrets.ORACLE_3_ADDRESS }}
          ORACLE_THRESHOLD: ${{ secrets.ORACLE_THRESHOLD || '2' }}
        run: |
          set -euo pipefail
          cd contracts
          release=target/wasm32-unknown-unknown/release

          if [ -n "${CONTRACT_NAME:-}" ]; then
            wasm_files="$release/${CONTRACT_NAME}.wasm"
            [ -f "$wasm_files" ] || { echo "Error: WASM file not found: $wasm_files"; exit 1; }
          else
            wasm_files=$(ls "$release"/*.wasm)
          fi

          for wasm_file in $wasm_files; do
            contract_name=$(basename "$wasm_file" .wasm)
            echo "Deploying $contract_name to $STELLAR_NETWORK..."
            contract_id=$(stellar contract deploy --wasm "$wasm_file")
            echo "$contract_name deployed: $contract_id"
            echo "${contract_name}=${contract_id}" >> deployed-contracts.txt
            if [ "$contract_name" = "title_badge" ]; then
              stellar contract invoke --id "$contract_id" -- \
                initialize \
                --admin "$DEPLOYER_ADDRESS" \
                --verifiers "[\"$ORACLE_1_ADDRESS\", \"$ORACLE_2_ADDRESS\", \"$ORACLE_3_ADDRESS\"]" \
                --threshold "$ORACLE_THRESHOLD"
            fi
          done

      - name: Save deployment artifacts
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p deployment-artifacts
          cp contracts/target/wasm32-unknown-unknown/release/*.wasm deployment-artifacts/
          cp contracts/deployed-contracts.txt deployment-artifacts/
          {
            echo "Network: $STELLAR_NETWORK"
            echo "Deployment completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
          } > deployment-artifacts/deployment-log.txt

      - name: Upload deployment artifacts
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soroban-deployment-artifacts
          path: deployment-artifacts/
          retention-days: 30

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "## Soroban Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy (${{ github.event.inputs.environment || 'testnet' }})**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
