[project]
name = "agent-engines"
version = "0.1.0"
description = "AI engine infrastructure for KnightVerse chess platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",
    "numpy>=1.24",
    "pydantic>=2.0",
    "psutil>=5.9",
    "prometheus-client>=0.17.0",
    "redis>=4.5.0",
]

[project.optional-dependencies]
gpu = [
    "pynvml>=11.5",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["gpu_worker"]
