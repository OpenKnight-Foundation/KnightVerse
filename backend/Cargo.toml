[workspace]
resolver = "2"
members = [
    "src",
    "modules/api",
    "modules/db",
    "modules/db/entity",
    "modules/db/migrations",
    "modules/dto",
    "modules/error",
    "modules/service",
    "modules/security",
    "modules/chess",
    "modules/challenge",
    "modules/tournament",
    "modules/matchmaking",
    "modules/engine",
    "modules/move_protocol",
    "modules/pairing",
    "modules/st_core",
    "modules/metrics",
    "modules/archiving",
    "modules/integration_tests",
]

# BE-134: `modules/integration_tests` is a workspace member again. It was
# dropped because it was a manual `main()` harness (not `#[test]`s) built
# against `Tournament::new`/`BracketConfig` and the deleted `validation` crate.
# It has been rewritten as `#[actix_web::test]`s against the current APIs.
#
# The tests need a migrated PostgreSQL instance and skip cleanly when
# `TEST_DATABASE_URL` is unset, so `cargo test --workspace` still passes on a
# machine without one. CI starts a `postgres:16` service and sets the variable.

[workspace.dependencies]
regex = "1.10.2"
utoipa = "4.2.0"
