[package]
name = "matchmaking"
version = "0.1.0"
edition = "2021"

[lib]
path = "mod.rs"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deadpool-redis = "0.14"
redis = { version = "0.24", features = ["tokio-comp", "json"] }
tracing = "0.1"
