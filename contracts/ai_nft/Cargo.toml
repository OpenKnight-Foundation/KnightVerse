[package]
name = "ai_nft"
version = "0.1.0"
edition = "2021"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
upgrade_timelock = { path = "../upgrade_timelock" }
soroban-sdk = "21.0.0"

[dev-dependencies]
upgrade_timelock = { path = "../upgrade_timelock", features = ["testutils"] }
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
emergency_circuit_breaker = { path = "../emergency_circuit_breaker", features = ["testutils"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
