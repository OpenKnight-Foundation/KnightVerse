[package]
name = "common"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared Soroban admin, pause, two-step admin transfer and TTL helpers for KnightVerse contracts."

[lib]
crate-type = ["rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
