[package]
name = "title_badge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
upgrade_timelock = { path = "../upgrade_timelock" }
soroban-sdk = "21.0.0"

[dev-dependencies]
upgrade_timelock = { path = "../upgrade_timelock", features = ["testutils"] }
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
