[package]
name = "yield_staking"
version = "0.1.0"
edition = "2021"
publish = false
description = "SC-46: Automated liquidity-pool yield staking for long-term tournament prize pools."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
