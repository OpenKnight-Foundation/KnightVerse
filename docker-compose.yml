# KnightVerse local dependencies (Redis + Postgres).
#
# Monitoring (Prometheus / Grafana) is gated behind the "monitoring" profile
# so a plain `docker compose up` does not require GRAFANA_ADMIN_PASSWORD (#1431)
# and prometheus/grafana are real services (not volume definitions) (#1430).
#
# Start core services:
#   docker compose up -d
#
# Start monitoring as well:
#   GRAFANA_ADMIN_PASSWORD=changeme docker compose --profile monitoring up -d
#
# Or use the dedicated monitoring compose file:
#   docker compose -f backend/docker-compose.monitoring.yml --project-directory backend up -d

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: knightverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: knightverse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knightverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knightverse_password}
      POSTGRES_DB: ${POSTGRES_DB:-knightverse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knightverse}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional monitoring profile (#1430 / #1431). Not started by default.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: knightverse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: knightverse-grafana
    ports:
      - "3000:3000"
    environment:
      # Default keeps local profile usable; override in production (#1431).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-knightverse}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
